<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="auto" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr-vf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="vfShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="532" height="332" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#vfShadow)"/>

  <!-- Title Badge -->
  <rect x="25" y="18" width="230" height="26" rx="5" fill="#eff6ff"/>
  <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">SCALAR (V/f) SPEED CONTROL</text>

  <!-- Region Labels Background -->
  <!-- Constant Torque Region -->
  <rect x="55" y="55" width="225" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="167" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">Constant V/f (Constant Torque)</text>

  <!-- Field Weakening Region -->
  <rect x="285" y="55" width="225" height="24" rx="4" fill="#fefce8" stroke="#fef08a"/>
  <text x="397" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ca8a04" text-anchor="middle">Field Weakening (V = V_rated)</text>

  <!-- Coordinate Axes -->
  <line x1="55" y1="280" x2="515" y2="280" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr-vf)"/>
  <line x1="55" y1="280" x2="55" y2="85" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr-vf)"/>

  <!-- Axis Labels -->
  <text x="515" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="end">Speed ω (Frequency f)</text>
  <text x="60" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Torque T</text>

  <!-- Base Frequency Dividing Line -->
  <line x1="280" y1="90" x2="280" y2="280" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="280" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">f<tspan font-size="9" dy="2">base</tspan> (Rated)</text>

  <!-- Max Torque Envelope Line (T_max constant below base frequency, then droops) -->
  <line x1="55" y1="120" x2="280" y2="120" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 3"/>
  <path d="M 280 120 C 340 125, 410 180, 480 230" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="62" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#dc2626">T<tspan font-size="9" dy="2">max</tspan> (Constant)</text>

  <!-- Torque-Speed Curves at different frequencies -->
  <!-- Curve 1: 15 Hz -->
  <path d="M 55 240 C 70 210, 85 120, 100 120 C 115 120, 120 220, 125 280" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#2563eb">f₁</text>

  <!-- Curve 2: 30 Hz -->
  <path d="M 55 260 C 100 240, 150 120, 175 120 C 190 120, 200 220, 205 280" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#2563eb">f₂</text>

  <!-- Curve 3: 50 Hz (Rated) -->
  <path d="M 55 270 C 140 250, 250 120, 280 120 C 295 120, 305 220, 310 280" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="312" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">f_rated</text>

  <!-- Curve 4: 75 Hz (Above Base Speed) -->
  <path d="M 55 278 C 220 270, 360 165, 385 165 C 400 165, 410 240, 420 280" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="422" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#d97706">f₄ &gt; f_base</text>

  <!-- Footer explanation note -->
  <rect x="25" y="308" width="490" height="20" rx="4" fill="#f8fafc"/>
  <text x="270" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Below f_base: V/f = const (no core saturation). Above f_base: V = V_rated, flux ∝ 1/f</text>
</svg>

