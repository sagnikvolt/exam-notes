<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="532" height="392" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Quadrant Background Panels -->
  <!-- Q2: Top-Left -->
  <rect x="24" y="24" width="236" height="166" rx="8" fill="#f8fafc"/>
  <!-- Q1: Top-Right -->
  <rect x="280" y="24" width="236" height="166" rx="8" fill="#eff6ff"/>
  <!-- Q3: Bottom-Left -->
  <rect x="24" y="210" width="236" height="166" rx="8" fill="#eff6ff"/>
  <!-- Q4: Bottom-Right -->
  <rect x="280" y="210" width="236" height="166" rx="8" fill="#f8fafc"/>

  <!-- Coordinate Axes -->
  <!-- Horizontal Axis: Torque (T) -->
  <line x1="30" y1="200" x2="510" y2="200" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <!-- Vertical Axis: Speed (ω) -->
  <line x1="270" y1="370" x2="270" y2="30" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="515" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e293b">+T (Torque)</text>
  <text x="25" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="end">-T</text>
  
  <text x="275" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e293b">+ω (Speed)</text>
  <text x="275" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e293b">-ω</text>

  <text x="260" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">0</text>

  <!-- QUADRANT I (Top-Right) -->
  <g transform="translate(398, 105)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="-95" y="-65" width="190" height="30" rx="6" fill="#2563eb" fill-opacity="0.1"/>
    <text x="0" y="-45" font-size="15" font-weight="800" fill="#1d4ed8">QUADRANT I</text>
    <text x="0" y="-12" font-size="16" font-weight="700" fill="#0f172a">Forward Motoring</text>
    <text x="0" y="12" font-size="13" font-weight="600" fill="#334155">ω &gt; 0,  T &gt; 0</text>
    <text x="0" y="32" font-size="13" font-weight="700" fill="#16a34a">Power P = T·ω &gt; 0 (Delivered)</text>
  </g>

  <!-- QUADRANT II (Top-Left) -->
  <g transform="translate(142, 105)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="-95" y="-65" width="190" height="30" rx="6" fill="#f59e0b" fill-opacity="0.12"/>
    <text x="0" y="-45" font-size="15" font-weight="800" fill="#b45309">QUADRANT II</text>
    <text x="0" y="-12" font-size="16" font-weight="700" fill="#0f172a">Forward Braking</text>
    <text x="0" y="8" font-size="12" font-weight="600" fill="#475569">(Regenerative Braking)</text>
    <text x="0" y="28" font-size="13" font-weight="600" fill="#334155">ω &gt; 0,  T &lt; 0  ⇒  P &lt; 0</text>
  </g>

  <!-- QUADRANT III (Bottom-Left) -->
  <g transform="translate(142, 290)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="-95" y="-65" width="190" height="30" rx="6" fill="#2563eb" fill-opacity="0.1"/>
    <text x="0" y="-45" font-size="15" font-weight="800" fill="#1d4ed8">QUADRANT III</text>
    <text x="0" y="-12" font-size="16" font-weight="700" fill="#0f172a">Reverse Motoring</text>
    <text x="0" y="12" font-size="13" font-weight="600" fill="#334155">ω &lt; 0,  T &lt; 0</text>
    <text x="0" y="32" font-size="13" font-weight="700" fill="#16a34a">Power P = T·ω &gt; 0 (Delivered)</text>
  </g>

  <!-- QUADRANT IV (Bottom-Right) -->
  <g transform="translate(398, 290)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="-95" y="-65" width="190" height="30" rx="6" fill="#f59e0b" fill-opacity="0.12"/>
    <text x="0" y="-45" font-size="15" font-weight="800" fill="#b45309">QUADRANT IV</text>
    <text x="0" y="-12" font-size="16" font-weight="700" fill="#0f172a">Reverse Braking</text>
    <text x="0" y="8" font-size="12" font-weight="600" fill="#475569">(Plugging / Dynamic)</text>
    <text x="0" y="28" font-size="13" font-weight="600" fill="#334155">ω &lt; 0,  T &gt; 0  ⇒  P &lt; 0</text>
  </g>
</svg>

