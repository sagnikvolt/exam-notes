<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#334155"/></marker></defs><rect x="2" y="2" width="596" height="256" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
