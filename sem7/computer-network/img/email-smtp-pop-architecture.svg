<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="em-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="pull-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="756" height="316" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Electronic Mail System Architecture (Push vs. Pull Protocols)</text>

  <!-- Alice / Sender MUA -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Sender (Alice)</text>
    <rect x="15" y="38" width="90" height="36" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="60" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">MUA (UA)</text>
    <text x="60" y="80" text-anchor="middle" font-size="9" fill="#64748b">Mail User Agent</text>
  </g>

  <!-- SMTP Push 1 Arrow -->
  <line x1="150" y1="115" x2="205" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#em-arr)"/>
  <rect x="153" y="82" width="50" height="20" rx="3" fill="#dbeafe"/>
  <text x="178" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">SMTP</text>
  <text x="178" y="132" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">(Push)</text>

  <!-- Alice Mail Server (MTA) -->
  <g transform="translate(210, 55)">
    <rect x="0" y="0" width="130" height="120" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Sender Mail Server</text>
    <rect x="15" y="35" width="100" height="32" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="65" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">MTA (Client)</text>
    <rect x="15" y="75" width="100" height="32" rx="3" fill="#fef9c3" stroke="#fcd34d" stroke-width="1"/>
    <text x="65" y="95" text-anchor="middle" font-size="10" fill="#854d0e">Mail Queue Spool</text>
  </g>

  <!-- SMTP Relay Push across Internet Arrow -->
  <line x1="340" y1="115" x2="415" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#em-arr)"/>
  <rect x="350" y="78" width="55" height="20" rx="3" fill="#dbeafe"/>
  <text x="378" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">SMTP</text>
  <text x="378" y="132" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">(Internet Relay)</text>

  <!-- Bob Mail Server (MTA + Mailbox) -->
  <g transform="translate(420, 55)">
    <rect x="0" y="0" width="130" height="120" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Receiver Mail Server</text>
    <rect x="15" y="35" width="100" height="32" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="65" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">MTA (Server)</text>
    <rect x="15" y="75" width="100" height="32" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="65" y="95" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Bob's Mailbox</text>
  </g>

  <!-- POP3 / IMAP Pull Arrow -->
  <line x1="550" y1="115" x2="605" y2="115" stroke="#16a34a" stroke-width="2.5" marker-end="url(#pull-arr)"/>
  <rect x="550" y="78" width="55" height="20" rx="3" fill="#dcfce7"/>
  <text x="578" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">POP3 / IMAP</text>
  <text x="578" y="132" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">(Pull Access)</text>

  <!-- Bob / Receiver MUA -->
  <g transform="translate(610, 70)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Receiver (Bob)</text>
    <rect x="15" y="38" width="90" height="36" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="60" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">MUA (UA)</text>
    <text x="60" y="80" text-anchor="middle" font-size="9" fill="#64748b">Mail User Agent</text>
  </g>

  <!-- Explanatory Legend / Core Concept Footer -->
  <rect x="30" y="200" width="700" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="222" font-size="12" font-weight="700" fill="#0f172a">Why SMTP cannot be used for the final delivery to Bob:</text>
  <g font-size="11.5" fill="#334155">
    <text x="45" y="244">• <tspan font-weight="700" fill="#1e40af">SMTP is a PUSH protocol:</tspan> The sender initiates connection. Since Bob's personal computer is often turned off or on dynamic IP, it cannot run an always-on SMTP daemon listening for incoming connections.</text>
    <text x="45" y="266">• <tspan font-weight="700" fill="#15803d">Mail Access Protocols (POP3 / IMAP) are PULL protocols:</tspan> Bob initiates the connection when he opens his app to authenticate and pull messages from the always-on server mailbox.</text>
    <text x="45" y="288">• <tspan font-weight="700" fill="#b45309">Port Summary:</tspan> SMTP uses Port 25 (relay) / 587 (submission); POP3 uses Port 110 (995 SSL); IMAP uses Port 143 (993 SSL).</text>
  </g>
</svg>
