<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dhcp-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arp-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="756" height="406" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">DHCP 4-Way Handshake (DORA) &amp; ARP Duplicate IP Verification</text>

  <!-- Lifeline Headers -->
  <rect x="80" y="45" width="160" height="35" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">DHCP Client (Port 68)</text>

  <rect x="520" y="45" width="160" height="35" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">DHCP Server (Port 67)</text>

  <!-- Lifelines -->
  <line x1="160" y1="80" x2="160" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="600" y1="80" x2="600" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: DHCPDISCOVER -->
  <line x1="160" y1="110" x2="595" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#dhcp-arr)"/>
  <rect x="240" y="95" width="280" height="26" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">1. DHCPDISCOVER (Broadcast 255.255.255.255)</text>

  <!-- Step 2: DHCPOFFER -->
  <line x1="600" y1="155" x2="165" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#dhcp-arr)"/>
  <rect x="230" y="145" width="300" height="26" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="380" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">2. DHCPOFFER (Offered IP, Mask, Lease, Gateway)</text>

  <!-- Step 3: DHCPREQUEST -->
  <line x1="160" y1="200" x2="595" y2="215" stroke="#2563eb" stroke-width="2" marker-end="url(#dhcp-arr)"/>
  <rect x="235" y="190" width="290" height="26" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="380" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">3. DHCPREQUEST (Broadcast to accept offer)</text>

  <!-- Step 4: DHCPACK -->
  <line x1="600" y1="245" x2="165" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#dhcp-arr)"/>
  <rect x="245" y="235" width="270" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="380" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">4. DHCPACK (Final lease confirmation)</text>

  <!-- Step 5: ARP Verification -->
  <path d="M 160 285 C 220 280, 220 315, 165 315" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arp-arr)"/>
  <rect x="180" y="290" width="370" height="26" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="365" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">5. Client sends 3 ARP Probes to ensure NO IP conflict</text>

  <!-- Note Footer -->
  <rect x="40" y="345" width="680" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <g font-size="11" fill="#475569">
    <text x="55" y="364">• <tspan font-weight="700" fill="#1e40af">Broadcast Reasons:</tspan> Client has no IP (uses 0.0.0.0); does not know Server IP initially.</text>
    <text x="55" y="382">• <tspan font-weight="700" fill="#b45309">Safety Check:</tspan> If an ARP reply is received, IP is in conflict → sends DHCPDECLINE and restarts.</text>
  </g>
</svg>
