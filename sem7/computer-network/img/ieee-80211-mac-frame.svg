<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Outer Card -->
  <rect x="2" y="2" width="756" height="376" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">IEEE 802.11 MAC Frame Structure &amp; Frame Control Field</text>

  <!-- Frame Layout Section Header -->
  <text x="30" y="60" font-size="13" font-weight="700" fill="#2563eb">1. General MAC Frame Format (bytes)</text>

  <!-- Top Frame Fields -->
  <g transform="translate(30, 70)" font-size="11" text-anchor="middle">
    <!-- Frame Control: 2B -->
    <rect x="0" y="0" width="70" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="35" y="19" font-weight="700" fill="#1e40af">Frame Ctrl</text>
    <text x="35" y="34" fill="#3b82f6">2 Bytes</text>

    <!-- Duration / ID: 2B -->
    <rect x="74" y="0" width="65" height="42" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="106" y="19" font-weight="600" fill="#334155">Duration</text>
    <text x="106" y="34" fill="#64748b">2 Bytes</text>

    <!-- Address 1: 6B -->
    <rect x="143" y="0" width="72" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="179" y="19" font-weight="700" fill="#92400e">Address 1</text>
    <text x="179" y="34" fill="#b45309">6 B (RA)</text>

    <!-- Address 2: 6B -->
    <rect x="219" y="0" width="72" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="255" y="19" font-weight="700" fill="#92400e">Address 2</text>
    <text x="255" y="34" fill="#b45309">6 B (TA)</text>

    <!-- Address 3: 6B -->
    <rect x="295" y="0" width="72" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="331" y="19" font-weight="700" fill="#92400e">Address 3</text>
    <text x="331" y="34" fill="#b45309">6 B (DA/SA)</text>

    <!-- Seq Control: 2B -->
    <rect x="371" y="0" width="62" height="42" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="402" y="19" font-weight="600" fill="#334155">Seq Ctrl</text>
    <text x="402" y="34" fill="#64748b">2 Bytes</text>

    <!-- Address 4: 6B -->
    <rect x="437" y="0" width="72" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="473" y="19" font-weight="700" fill="#92400e">Address 4</text>
    <text x="473" y="34" fill="#b45309">6 B (WDS)</text>

    <!-- Frame Body: 0-2312B -->
    <rect x="513" y="0" width="125" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="575" y="19" font-weight="700" fill="#15803d">Frame Body (Payload)</text>
    <text x="575" y="34" fill="#16a34a">0 – 2312 Bytes</text>

    <!-- FCS: 4B -->
    <rect x="642" y="0" width="58" height="42" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="671" y="19" font-weight="700" fill="#b91c1c">FCS</text>
    <text x="671" y="34" fill="#dc2626">4 Bytes</text>
  </g>

  <!-- Connecting Expansion Lines from Frame Ctrl -->
  <path d="M 65 114 L 30 180" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 65 114 L 730 180" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Frame Control Detail Header -->
  <text x="30" y="165" font-size="13" font-weight="700" fill="#1e40af">2. Frame Control Field Sub-division (16 bits / 2 Bytes)</text>

  <!-- Frame Control Subfields (Total 16 bits) -->
  <g transform="translate(30, 185)" font-size="10" text-anchor="middle">
    <!-- Protocol: 2 bits -->
    <rect x="0" y="0" width="55" height="48" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="27" y="18" font-weight="700" fill="#1e40af">Prot. Ver</text>
    <text x="27" y="32" fill="#64748b">2 bits</text>
    <text x="27" y="44" fill="#2563eb">00</text>

    <!-- Type: 2 bits -->
    <rect x="58" y="0" width="55" height="48" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="85" y="18" font-weight="700" fill="#1e40af">Type</text>
    <text x="85" y="32" fill="#64748b">2 bits</text>
    <text x="85" y="44" fill="#2563eb">Mgmt/Ctrl/Data</text>

    <!-- Subtype: 4 bits -->
    <rect x="116" y="0" width="70" height="48" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="151" y="18" font-weight="700" fill="#1e40af">Subtype</text>
    <text x="151" y="32" fill="#64748b">4 bits</text>
    <text x="151" y="44" fill="#2563eb">RTS/CTS/etc</text>

    <!-- To DS: 1 bit -->
    <rect x="189" y="0" width="55" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="216" y="18" font-weight="700" fill="#334155">To DS</text>
    <text x="216" y="32" fill="#64748b">1 bit</text>
    <text x="216" y="44" fill="#64748b">To AP</text>

    <!-- From DS: 1 bit -->
    <rect x="247" y="0" width="58" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="276" y="18" font-weight="700" fill="#334155">From DS</text>
    <text x="276" y="32" fill="#64748b">1 bit</text>
    <text x="276" y="44" fill="#64748b">From AP</text>

    <!-- More Frag: 1 bit -->
    <rect x="308" y="0" width="60" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="338" y="18" font-weight="600" fill="#334155">More Frag</text>
    <text x="338" y="32" fill="#64748b">1 bit</text>
    <text x="338" y="44" fill="#64748b">Fragments</text>

    <!-- Retry: 1 bit -->
    <rect x="371" y="0" width="52" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="397" y="18" font-weight="600" fill="#334155">Retry</text>
    <text x="397" y="32" fill="#64748b">1 bit</text>
    <text x="397" y="44" fill="#64748b">Retrans.</text>

    <!-- Pwr Mgt: 1 bit -->
    <rect x="426" y="0" width="56" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="454" y="18" font-weight="600" fill="#334155">Pwr Mgt</text>
    <text x="454" y="32" fill="#64748b">1 bit</text>
    <text x="454" y="44" fill="#64748b">Sleep/Active</text>

    <!-- More Data: 1 bit -->
    <rect x="485" y="0" width="66" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="518" y="18" font-weight="600" fill="#334155">More Data</text>
    <text x="518" y="32" fill="#64748b">1 bit</text>
    <text x="518" y="44" fill="#64748b">Buffered</text>

    <!-- WEP / Protect: 1 bit -->
    <rect x="554" y="0" width="56" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="582" y="18" font-weight="600" fill="#334155">Protect</text>
    <text x="582" y="32" fill="#64748b">1 bit</text>
    <text x="582" y="44" fill="#64748b">Encrypted</text>

    <!-- Order: 1 bit -->
    <rect x="613" y="0" width="50" height="48" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="638" y="18" font-weight="600" fill="#334155">Order</text>
    <text x="638" y="32" fill="#64748b">1 bit</text>
    <text x="638" y="44" fill="#64748b">Strict</text>
  </g>

  <!-- Explanation Table Box at bottom -->
  <rect x="30" y="255" width="700" height="105" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="275" font-size="12" font-weight="700" fill="#0f172a">Summary of the 4 Address Fields depending on To DS / From DS bits:</text>
  <g font-size="11.5" fill="#334155">
    <text x="45" y="295">• <tspan font-weight="700">To DS=0, From DS=0</tspan> (Ad-hoc / IBSS): Addr1 = Destination (DA), Addr2 = Source (SA), Addr3 = BSSID, Addr4 = N/A</text>
    <text x="45" y="315">• <tspan font-weight="700">To DS=1, From DS=0</tspan> (Station to AP): Addr1 = AP BSSID (RA), Addr2 = Station (SA/TA), Addr3 = Destination (DA), Addr4 = N/A</text>
    <text x="45" y="335">• <tspan font-weight="700">To DS=0, From DS=1</tspan> (AP to Station): Addr1 = Station (DA/RA), Addr2 = AP BSSID (TA), Addr3 = Source (SA), Addr4 = N/A</text>
    <text x="45" y="352">• <tspan font-weight="700">To DS=1, From DS=1</tspan> (Wireless Distribution System AP-to-AP bridge): Addr1=RA, Addr2=TA, Addr3=DA, Addr4=SA</text>
  </g>
</svg>
