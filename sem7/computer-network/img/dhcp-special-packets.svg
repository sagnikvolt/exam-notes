<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="756" height="346" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">DHCP Special &amp; Auxiliary Packet Types (NAK, DECLINE, RELEASE, INFORM)</text>

  <!-- 4 Cards Grid (2x2) -->
  <!-- Top Left: DHCPNAK -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="335" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="10" y="10" width="100" height="24" rx="4" fill="#dc2626"/>
    <text x="60" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DHCPNAK</text>
    <text x="120" y="26" font-size="11" font-weight="700" fill="#991b1b">Server &#8594; Client (Negative ACK)</text>

    <text x="15" y="55" font-size="11" fill="#7f1d1d" font-weight="600">&#8226; When Triggered:</text>
    <text x="25" y="72" font-size="10.5" fill="#334155">Client requests an invalid or expired IP lease</text>
    <text x="25" y="87" font-size="10.5" fill="#334155">(e.g., moved to a completely different subnet).</text>
    <text x="15" y="108" font-size="10.5" font-weight="700" fill="#b91c1c">&#10140; Result: Client immediately restarts DORA from scratch.</text>
  </g>

  <!-- Top Right: DHCPDECLINE -->
  <g transform="translate(395, 55)">
    <rect x="0" y="0" width="335" height="125" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <rect x="10" y="10" width="115" height="24" rx="4" fill="#d97706"/>
    <text x="67" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DHCPDECLINE</text>
    <text x="135" y="26" font-size="11" font-weight="700" fill="#92400e">Client &#8594; Server (Rejection)</text>

    <text x="15" y="55" font-size="11" fill="#78350f" font-weight="600">&#8226; When Triggered:</text>
    <text x="25" y="72" font-size="10.5" fill="#334155">Client sends 3 ARP probes and receives a reply,</text>
    <text x="25" y="87" font-size="10.5" fill="#334155">proving another device already uses the offered IP.</text>
    <text x="15" y="108" font-size="10.5" font-weight="700" fill="#b45309">&#10140; Result: Server flags IP as bad; Client requests a new one.</text>
  </g>

  <!-- Bottom Left: DHCPRELEASE -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="335" height="125" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="10" y="10" width="120" height="24" rx="4" fill="#16a34a"/>
    <text x="70" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DHCPRELEASE</text>
    <text x="140" y="26" font-size="11" font-weight="700" fill="#15803d">Client &#8594; Server (Relinquish)</text>

    <text x="15" y="55" font-size="11" fill="#14532d" font-weight="600">&#8226; When Triggered:</text>
    <text x="25" y="72" font-size="10.5" fill="#334155">Client performs an orderly graceful shutdown or</text>
    <text x="25" y="87" font-size="10.5" fill="#334155">disconnects from the network before lease expiry.</text>
    <text x="15" y="108" font-size="10.5" font-weight="700" fill="#15803d">&#10140; Result: Server returns IP back to available pool instantly.</text>
  </g>

  <!-- Bottom Right: DHCPINFORM -->
  <g transform="translate(395, 195)">
    <rect x="0" y="0" width="335" height="125" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="10" y="10" width="115" height="24" rx="4" fill="#2563eb"/>
    <text x="67" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">DHCPINFORM</text>
    <text x="135" y="26" font-size="11" font-weight="700" fill="#1e40af">Client &#8594; Server (Config Only)</text>

    <text x="15" y="55" font-size="11" fill="#1e3a8a" font-weight="600">&#8226; When Triggered:</text>
    <text x="25" y="72" font-size="10.5" fill="#334155">Client already has an IP address assigned statically,</text>
    <text x="25" y="87" font-size="10.5" fill="#334155">and only queries the server for network options.</text>
    <text x="15" y="108" font-size="10.5" font-weight="700" fill="#1d4ed8">&#10140; Result: Server replies with DHCPACK containing DNS/Gateway.</text>
  </g>
</svg>
