<text x="155" y="204" font-size="13.5" fill="#475569">PC = program counter</text><text x="155" y="221" font-size="13.5" fill="#475569">IR = instruction register</text><text x="155" y="238" font-size="13.5" fill="#475569">SP = stack pointer</text>
