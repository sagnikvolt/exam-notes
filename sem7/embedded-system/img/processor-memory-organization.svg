<rect x="400" y="140" width="180" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="490" y="164" font-weight="700" font-size="14">Data memory</text><text x="490" y="184">RAM</text><text x="490" y="204" font-size="14.5" fill="#475569">variables, stack</text>
<rect x="400" y="256" width="180" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="490" y="277" font-weight="700">I/O ports, timers</text><text x="490" y="294" font-size="14.5" fill="#475569">peripherals</text>
<line x1="290" y1="70" x2="398" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><line x1="290" y1="190" x2="398" y2="190" stroke="#334155" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="290" y1="281" x2="398" y2="281" stroke="#334155" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="344" y="60" font-size="14.5">address</text><text x="344" y="182" font-size="14.5">data</text><text x="344" y="272" font-size="14.5">control</text>
