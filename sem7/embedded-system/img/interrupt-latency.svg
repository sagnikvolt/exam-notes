<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#334155"/></marker></defs><rect x="2" y="2" width="616" height="246" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<g font-size="13.5" text-anchor="middle" fill="#0f172a">
<line x1="30" y1="150" x2="590" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="590" y="170" text-anchor="end" fill="#475569">time</text>
<rect x="30" y="118" width="110" height="32" fill="#dbeafe" stroke="#2563eb"/><text x="85" y="138">Main program</text>
<rect x="140" y="118" width="70" height="32" fill="#fef3c7" stroke="#d97706"/><text x="175" y="132">Finish</text><text x="175" y="145">instruction</text>
<rect x="210" y="118" width="80" height="32" fill="#fde68a" stroke="#d97706"/><text x="250" y="132">Save context</text><text x="250" y="145">+ get vector</text>
<rect x="290" y="118" width="170" height="32" fill="#dcfce7" stroke="#16a34a"/><text x="375" y="138" font-weight="700">ISR runs</text>
<rect x="460" y="118" width="60" height="32" fill="#fde68a" stroke="#d97706"/><text x="490" y="132">Restore</text><text x="490" y="145">context</text>
<rect x="520" y="118" width="70" height="32" fill="#dbeafe" stroke="#2563eb"/><text x="555" y="138">Main again</text>
<line x1="140" y1="30" x2="140" y2="116" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><text x="140" y="24" fill="#dc2626" font-weight="700">Interrupt request (IRQ)</text>
<line x1="290" y1="60" x2="290" y2="116" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/><text x="290" y="54" fill="#15803d" font-weight="700">First ISR instruction</text>
<line x1="140" y1="84" x2="290" y2="84" stroke="#7c3aed" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="215" y="78" fill="#7c3aed" font-weight="700">Interrupt latency</text>
<line x1="140" y1="205" x2="520" y2="205" stroke="#0891b2" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="330" y="224" fill="#0e7490" font-weight="700">Total response (until main program resumes)</text>
</g>
</svg>
